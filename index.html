<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pro</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial;
  padding: 15px;
  background: #121212;
  color: white;
}

.container {
  max-width: 400px;
  margin: auto;
}

.calc {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  height: 45px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: none;
  padding: 5px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

button {
  height: 50px;
  border-radius: 10px;
  border: none;
}

.history {
  max-height: 120px;
  overflow-y: auto;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h2>Kalkulator</h2>
<div class="calc">
<input id="display" disabled>

<div class="buttons">
<button onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="add('%')">%</button>
<button onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="calculate()">=</button>
</div>
</div>

<h3>Kalkulator Cicilan</h3>
<div class="calc">
<input type="number" id="loan" placeholder="Total pinjaman">
<input type="number" id="interest" placeholder="Bunga (%)">
<input type="number" id="months" placeholder="Bulan">

<button onclick="calcLoan()">Hitung</button>
<p id="loanResult"></p>
</div>

<h3>History</h3>
<div class="calc history" id="history"></div>

</div>

<script>
let expression = "";
let history = JSON.parse(localStorage.getItem("history")) || [];

function saveHistory() {
  localStorage.setItem("history", JSON.stringify(history));
}

function updateHistory() {
  document.getElementById("history").innerHTML =
    history.slice(0, 10).map(h => "<div>"+h+"</div>").join("");
}

updateHistory();

function add(v){
  expression += v;
  display();
}

function display(){
  document.getElementById("display").value = expression;
}

function clearDisplay(){
  expression = "";
  display();
}

function backspace(){
  expression = expression.slice(0,-1);
  display();
}

function calculate(){
  try{
    if(!/^[0-9+\-*/%.]+$/.test(expression)) throw "err";
    let result = Function("return " + expression)();
    history.unshift(expression+" = "+result);
    saveHistory();
    updateHistory();
    expression = result.toString();
    display();
  }catch{
    alert("Error");
  }
}

function calcLoan(){
  let loan = parseFloat(document.getElementById("loan").value);
  let interest = parseFloat(document.getElementById("interest").value)/100;
  let months = parseFloat(document.getElementById("months").value);

  if(!loan || !months) return;

  let total = loan + (loan * interest);
  let monthly = total / months;

  document.getElementById("loanResult").innerText =
    "Cicilan per bulan: " + monthly.toFixed(2);
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
